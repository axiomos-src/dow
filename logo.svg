<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">DOW — DOS on Windows</title>
  <desc id="desc">A retro CRT monitor icon with a phosphor-green command prompt reading C:\&gt; and the letters DOW.</desc>

  <defs>
    <!-- Background gradient: deep CRT black to dark navy -->
    <radialGradient id="screenBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%"  stop-color="#0b1a10"/>
      <stop offset="60%" stop-color="#06110a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Phosphor green glow -->
    <linearGradient id="phosphor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#b6ffb6"/>
      <stop offset="55%" stop-color="#39ff6a"/>
      <stop offset="100%" stop-color="#0f7a2e"/>
    </linearGradient>

    <!-- Bezel gradient (brushed plastic) -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e9e9e9"/>
      <stop offset="50%" stop-color="#bfbfbf"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>

    <!-- Soft outer glow for text -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for the DOW wordmark -->
    <filter id="glowStrong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect y="3" width="4" height="1" fill="#000000" opacity="0.35"/>
    </pattern>

    <!-- Screen clip so scanlines/glow stay inside -->
    <clipPath id="screenClip">
      <rect x="96" y="112" width="320" height="224" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- ============ MONITOR BODY ============ -->
  <!-- Outer bezel -->
  <rect x="56" y="72" width="400" height="304" rx="28" ry="28"
        fill="url(#bezel)" stroke="#5a5a5a" stroke-width="4"/>

  <!-- Inner bezel shadow -->
  <rect x="72" y="88" width="368" height="272" rx="22" ry="22"
        fill="#2a2a2a"/>

  <!-- ============ SCREEN ============ -->
  <rect x="88" y="104" width="336" height="240" rx="16" ry="16"
        fill="url(#screenBg)"/>

  <!-- Screen content (clipped) -->
  <g clip-path="url(#screenClip)">

    <!-- Faint green inner vignette -->
    <rect x="96" y="112" width="320" height="224"
          fill="#39ff6a" opacity="0.04"/>

    <!-- Top-of-screen prompt line: C:\> -->
    <text x="120" y="168"
          font-family="Consolas, 'Courier New', monospace"
          font-size="34"
          fill="url(#phosphor)"
          filter="url(#glow)">C:\&gt;_</text>

    <!-- Big DOW wordmark -->
    <text x="256" y="268"
          text-anchor="middle"
          font-family="Consolas, 'Courier New', monospace"
          font-weight="700"
          font-size="104"
          letter-spacing="6"
          fill="url(#phosphor)"
          filter="url(#glowStrong)">DOW</text>

    <!-- Subtitle -->
    <text x="256" y="316"
          text-anchor="middle"
          font-family="Consolas, 'Courier New', monospace"
          font-size="18"
          letter-spacing="4"
          fill="#9dffbe"
          opacity="0.85">DOS on Windows</text>

    <!-- Scanlines overlay -->
    <rect x="96" y="112" width="320" height="224" fill="url(#scanlines)"/>

    <!-- CRT glass reflection -->
    <path d="M 96 112 L 300 112 L 96 300 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- Screen border highlight -->
  <rect x="88" y="104" width="336" height="240" rx="16" ry="16"
        fill="none" stroke="#0e2a17" stroke-width="3"/>

  <!-- ============ MONITOR DETAILS ============ -->
  <!-- Power LED -->
  <circle cx="404" cy="352" r="6" fill="#39ff6a" filter="url(#glow)"/>
  <circle cx="404" cy="352" r="3" fill="#eaffee"/>

  <!-- Power label -->
  <text x="390" y="356" text-anchor="end"
        font-family="Consolas, monospace" font-size="11"
        fill="#4a4a4a">POWER</text>

  <!-- Monitor stand -->
  <rect x="200" y="376" width="112" height="18" rx="4" fill="#7a7a7a"/>
  <path d="M 176 440 L 336 440 L 316 394 L 196 394 Z" fill="#9a9a9a"/>
  <rect x="160" y="440" width="192" height="14" rx="4" fill="#6d6d6d"/>

  <!-- ============ FLOPPY DISK ACCENT (bottom-right) ============ -->
  <g transform="translate(348,404) rotate(-8)">
    <rect x="0" y="0" width="112" height="112" rx="6"
          fill="#1a1a1a" stroke="#39ff6a" stroke-width="3"/>
    <!-- shutter -->
    <rect x="20" y="10" width="58" height="34" rx="3" fill="#c0c0c0"/>
    <rect x="60" y="10" width="18" height="34" fill="#8a8a8a"/>
    <!-- label -->
    <rect x="16" y="60" width="80" height="34" rx="2" fill="#e6e6d2"/>
    <line x1="22" y1="70" x2="88" y2="70" stroke="#39ff6a" stroke-width="2"/>
    <line x1="22" y1="78" x2="88" y2="78" stroke="#39ff6a" stroke-width="2"/>
    <line x1="22" y1="86" x2="70" y2="86" stroke="#39ff6a" stroke-width="2"/>
  </g>

  <!-- ============ CORNER TAG ============ -->
  <text x="64" y="488"
        font-family="Consolas, 'Courier New', monospace"
        font-size="14"
        fill="#39ff6a"
        opacity="0.9"
        letter-spacing="2">v1.0.0</text>

  <text x="448" y="488"
        text-anchor="end"
        font-family="Consolas, 'Courier New', monospace"
        font-size="14"
        fill="#9a9a9a"
        letter-spacing="2">DOW.EXE</text>
</svg>